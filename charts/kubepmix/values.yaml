# Scope
# Namespace - Mutate pods in the release namespace only & enforce NetworkPolicy
# Cluster - Mutate pods in all namespaces
scope: Namespace

server:
  image:
    repository: ghcr.io/kubepmix/kubepmix
    tag: 0.0.12
  webhook:
    port: 8443
  pmix:
    port: 3333
    envs:
      - name: PMIX_MCA_ptl_tcp_if_include
        value: "eth0"
