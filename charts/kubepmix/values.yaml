# When true - inject namespaceSelector to Release namespace in the Mutating webhook
# Note: Cluster-wide permissions are still required to create namespaced KubePMIx, as we create MutatingWebhookConfiguration
namespaced: false

# additional job & pod selector for mutating webhook. useful for CI jobs collocated in a single namespace
# additionalObjectSelector:
#   matchLabels:
#     ci.kubepmix.dev/job-id: "123456"

server:
  # Custom image. Default: ghcr.io/kubepmix/kubepmix:{{ .Chart.AppVersion }}
  # image: ghcr.io/kubepmix/kubepmix:0.0.61
  webhook:
    port: 8443
  pmix:
    port: 3333
    envs:
      - name: PMIX_MCA_ptl_tcp_if_include
        value: "eth0"
