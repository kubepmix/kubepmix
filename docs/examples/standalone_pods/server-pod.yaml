apiVersion: v1
kind: Pod
metadata:
  name: kubepmix-server
  labels:
    app: kubepmix-server
spec:
  containers:
    - name: server
      image: ghcr.io/kubepmix/kubepmix:latest
      ports:
        - name: pmix-ptl
          containerPort: 3333
      env:
        # Bootstrap namespace
        - name: KUBE_PMIX_NAMESPACE_NAME
          value: "mynamespace"
        - name: KUBE_PMIX_JOB_SIZE
          value: "2"
        # Fix PMIx server interface and port
        - name: PMIX_MCA_ptl_tcp_ipv4_port
          value: "3333"
        - name: PMIX_MCA_ptl_tcp_if_include
          value: "eth0"
        # Required
        - name: PMIX_MCA_psec
          value: "none" # Do not check processes UID and GUID
      livenessProbe:
        exec:
          command: ["python3", "is_healthy.py"]
        initialDelaySeconds: 1
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 5
      readinessProbe:
        exec:
          command: ["python3", "is_healthy.py"]
        initialDelaySeconds: 1
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 5


# Service with fixed IP
---
apiVersion: v1
kind: Service
metadata:
  name: kubepmix
spec:
  selector:
    app: kubepmix-server
  ports:
    - name: pmix-ptl
      port: 3333
  clusterIP: 10.43.43.43
