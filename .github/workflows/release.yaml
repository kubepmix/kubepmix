name: Release
run-name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build release image
    runs-on: kubepmix-selfhosted
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: semver
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          major_pattern: "/!:|BREAKING CHANGE:/"
          major_regexp_flags: ""
          minor_pattern: "/feat(\\(.+\\))?:/"
          minor_regexp_flags: ""
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/build-image
        id: build-image
        with:
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.semver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  build-chart:
    name: Build helm chart
    runs-on: kubepmix-selfhosted
    needs: build-image
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/build-chart
        id: build-chart
        with:
          tag: ${{ needs.build-image.outputs.version }}

  create-release:
    name: Create release
    needs: [build-image, build-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build-image.outputs.version }}
          name: KubePMIx ${{ needs.build-image.outputs.version }}
          body: |
            # KubePMIx ${{ needs.build-image.outputs.version }} Release
            Branch: ${{ github.ref_name }} | Commit: [${{ github.sha }}](https://github.com/kubepmix/kubepmix/commit/${{ github.sha }})
            Image: [ghcr.io/${{ github.repository }}:${{ needs.build-image.outputs.version }}](https://github.com/kubepmix/kubepmix/pkgs/container/kubepmix?tag=${{ needs.build-image.outputs.version }})
            Helm Chart: [ghcr.io/kubepmix/charts/kubepmix-${{ needs.build-image.outputs.version }}.tgz](https://github.com/kubepmix/kubepmix/pkgs/container/charts/kubepmix?tag=${{ needs.build-image.outputs.version }})

            ## Get started
            ```sh
            helm -n kubepmix install kubepmix ghcr.io/kubepmix/charts/kubepmix --version ${{ needs.build-image.outputs.version }} --create-namespace
            ```

            And see [Running Jobs](https://github.com/kubepmix/kubepmix/blob/main/docs/jobs.md).
