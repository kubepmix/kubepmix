name: Test
run-name: "Test KubePMIX (${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }})"

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *" # 7 past every hour
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "charts/**"

permissions:
  contents: read

jobs:
  test:
    name: Run Test
    runs-on: kubepmix-selfhosted-test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-image
        id: build-image
        with:
          tags: registry.registry:5000/${{ github.repository }}:${{ github.sha }}

      - name: Deploy test environment
        uses: ./.github/actions/deploy-test-env
        with:
          name: ci-${{ github.run_id }}
          image: registry.registry:5000/${{ github.repository }}:${{ github.sha }}

      - name: Run tests
        run: pytest -sv --junitxml=results.xml
        working-directory: test/jobs

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: KubePMIx E2E Tests
          path: test/jobs/results.xml
          reporter: java-junit
          fail-on-error: true

      - name: Destroy test environment
        uses: ./.github/actions/destroy-test-env
        if: always()
        with:
          name: ci-${{ github.run_id }}
