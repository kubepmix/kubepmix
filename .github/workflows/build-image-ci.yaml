name: Package
run-name: Build CI image

on:
  workflow_dispatch:
  push:
    branches:
      - image-build

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: kubepmix-selfhosted
    steps:
      - uses: actions/checkout@v6

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            registry.registry/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: ${{ secrets.BUILDKIT_ENDPOINT }}
        env:
          BUILDER_NODE_0_AUTH_TLS_CACERT: ${{ secrets.BUILDKIT_CA_CRT }}
          BUILDER_NODE_0_AUTH_TLS_CERT: ${{ secrets.BUILDKIT_TLS_CRT }}
          BUILDER_NODE_0_AUTH_TLS_KEY: ${{ secrets.BUILDKIT_TLS_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
