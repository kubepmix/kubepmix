description: "Destroy test env"
inputs:
  name:
    description: "Name of the test env"
    required: true
    default: "ci"
runs:
  using: "composite"
  steps:
    - name: Install environment
      env:
        HELM_DRIVER: configmap
      shell: bash
      run: |
        helm -n ${{ inputs.name }} delete kubepmix --wait
        kubectl delete ns ${{ inputs.name }} --wait
