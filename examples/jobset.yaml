apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: jobset
  annotations:
    kueue.x-k8s.io/queue-name: jobset
spec:
  replicatedJobs:
    - name: rank0
      replicas: 1
      template:
        metadata:
          labels:
            kubepmix.dev/enabled: "true"
            kubepmix.dev/create: "true"
            kubepmix.dev/size: "2"
        spec:
          parallelism: 1
          completions: 1
          template:
            spec:
              schedulerName: coscheduler
              containers:
                - name: worker
                  image: ghcr.io/jjlakis/simplempi:0.1.0
                  env:
                    - name: SLEEP_TIME
                      value: "1"
                    - name: SLEEP_COUNT
                      value: "5"
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"
    - name: rank1
      replicas: 1
      template:
        metadata:
          labels:
            kubepmix.dev/enabled: "true"
        spec:
          parallelism: 1
          completions: 1
          template:
            spec:
              schedulerName: coscheduler
              containers:
                - name: worker
                  image: ghcr.io/jjlakis/simplempi:0.1.0
                  env:
                    - name: SLEEP_TIME
                      value: "1"
                    - name: SLEEP_COUNT
                      value: "1"
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"
