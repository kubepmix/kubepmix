                    - name: SLEEP_TIME
                      value: "5"
                    - name: SLEEP_COUNT
                      value: "1"
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"
              containers:
                - name: worker4
                  image: ghcr.io/jjlakis/simplempi:0.5.0
                  env:
                    - name: SLEEP_TIME
                      value: "5"
                    - name: SLEEP_COUNT
                      value: "1"
                    - name: OMPI_MCA_mpi_ft_enable
