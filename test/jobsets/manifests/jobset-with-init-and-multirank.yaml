            metadata:
              labels:
                kubepmix.dev/containerRanks: "4-5"
            spec:
              restartPolicy: Never
              terminationGracePeriodSeconds: 0
              initContainers:
                - name: init
                  image: ghcr.io/jjlakis/simplempi:0.5.0
