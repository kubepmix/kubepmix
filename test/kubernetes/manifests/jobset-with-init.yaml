apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: jobset
  annotations:
    kueue.x-k8s.io/queue-name: jobset
spec:
  failurePolicy:
    maxRestarts: 2
    restartStrategy: Recreate
    rules:
      - name: restartall
        action: RestartJobSetAndIgnoreMaxRestarts
        targetReplicatedJobs: []
        onJobFailureReasons: []
        onJobFailureMessagePatterns: []
  replicatedJobs:
    - name: rank0
      replicas: 1
      template:
        metadata:
          labels:
            kubepmix.dev/enabled: "true"
            kubepmix.dev/initContainerDepth: "0"
            kubepmix.dev/create: "true"
            kubepmix.dev/size: "3"
        spec:
          backoffLimit: 0
          parallelism: 1
          completions: 1
          template:
            spec:
              restartPolicy: Never
              terminationGracePeriodSeconds: 0
              initContainers:
                - name: init
                  image: ghcr.io/kubepmix/images/simplempi:latest
                  env:
                    - name: SLEEP_TIME
                      value: "5"
                    - name: SLEEP_COUNT
                      value: "1"
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"
              containers:
                - name: worker
                  image: ghcr.io/kubepmix/images/simplempi:latest
                  env:
                    - name: SLEEP_TIME
                      value: "5"
                    - name: SLEEP_COUNT
                      value: "5"
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"

                    # Run All Gather 10 times, 3 seconds apart, segfault on iteration 5.
                    - name: GATHER_COUNT
                      value: "10"
                    - name: GATHER_TIME
                      value: "3"
                    - name: SEGFAULT_ON
                      value: "5"
    - name: rank1
      replicas: 1
      template:
        metadata:
          labels:
            kubepmix.dev/enabled: "true"
            kubepmix.dev/initContainerDepth: "0"
        spec:
          backoffLimit: 0
          parallelism: 1
          completions: 1
          template:
            spec:
              restartPolicy: Never
              terminationGracePeriodSeconds: 0
              initContainers:
                - name: init
                  image: ghcr.io/kubepmix/images/simplempi:latest
                  env:
                    - name: SLEEP_TIME
                      value: "5"
                    - name: SLEEP_COUNT
                      value: "1"
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"
              containers:
                - name: worker
                  image: ghcr.io/kubepmix/images/simplempi:latest
                  env:
                    - name: SLEEP_TIME
                      value: "5"
                    - name: SLEEP_COUNT
                      value: "1"
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"

                    # Run All Gather 10 times, 3 seconds apart
                    - name: GATHER_COUNT
                      value: "10"
                    - name: GATHER_TIME
                      value: "3"
    - name: rank2
      replicas: 1
      template:
        metadata:
          labels:
            kubepmix.dev/enabled: "true"
            kubepmix.dev/initContainerDepth: "0"
        spec:
          backoffLimit: 0
          parallelism: 1
          completions: 1
          template:
            spec:
              restartPolicy: Never
              terminationGracePeriodSeconds: 0
              initContainers:
                - name: init
                  image: ghcr.io/kubepmix/images/simplempi:latest
                  env:
                    - name: SLEEP_TIME
                      value: "5"
                    - name: SLEEP_COUNT
                      value: "1"
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"
              containers:
                - name: worker
                  image: ghcr.io/kubepmix/images/simplempi:latest
                  env:
                    - name: SLEEP_TIME
                      value: "5"
                    - name: SLEEP_COUNT
                      value: "1"
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"

                    # Run All Gather 10 times, 3 seconds apart
                    - name: GATHER_COUNT
                      value: "10"
                    - name: GATHER_TIME
                      value: "3"
