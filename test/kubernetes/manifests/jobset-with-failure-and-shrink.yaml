apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: jobset
spec:
  failurePolicy:
    maxRestarts: 0 # We also inject finalizer to prevent cleanup of Pods for the log collection - see test/README.md
  replicatedJobs:
    - name: rank0-failing
      replicas: 1
      template:
        metadata:
          labels:
            kubepmix.dev/enabled: "true"
            kubepmix.dev/create: "true"
            kubepmix.dev/size: "2"
        spec:
          ttlSecondsAfterFinished: 5
          backoffLimit: 0
          parallelism: 1
          completions: 1
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: ghcr.io/jjlakis/simplempi:0.6.0
                  env:
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"
                    - name: "RANK_SPECIFIC_DATA"
                      value: "I am rank 0, yo maan"

                    # Run All Gather 5 times, 1 seconds apart, segfault on iteration 2.
                    - name: GATHER_COUNT
                      value: "5"
                    - name: GATHER_TIME
                      value: "1"
                    - name: SEGFAULT_ON
                      value: "2"

    - name: rank1-surviving
      replicas: 1
      template:
        metadata:
          labels:
            kubepmix.dev/enabled: "true"
        spec:
          ttlSecondsAfterFinished: 5
          backoffLimit: 0
          parallelism: 1
          completions: 1
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: ghcr.io/jjlakis/simplempi:0.6.0
                  env:
                    - name: OMPI_MCA_mpi_ft_enable
                      value: "1"
                    - name: "RANK_SPECIFIC_DATA"
                      value: "I will do the job of rank 1"

                    # Run All Gather 5 times, 1 seconds apart
                    - name: GATHER_COUNT
                      value: "5"
                    - name: GATHER_TIME
                      value: "1"
