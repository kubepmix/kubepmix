apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: jobset
spec:
  replicatedJobs:
    - name: rank0
      replicas: 1
      template:
        metadata:
          labels:
            kubepmix.dev/enabled: "true"
            kubepmix.dev/create: "true"
            kubepmix.dev/size: "2"
            kubepmix.dev/containerRanks: "0"
        spec:
          backoffLimit: 0
          parallelism: 1
          completions: 1
          template:
            spec:
              restartPolicy: Never
              terminationGracePeriodSeconds: 0
              containers:
                - name: worker
                  image: ghcr.io/jjlakis/simplempi:0.6.0
                  env:
                    - name: "RANK_SPECIFIC_DATA"
                      value: "I am rank 0, yo maan"

                    # Run 1 All Gather
                    - name: GATHER_COUNT
                      value: "1"
                    - name: GATHER_TIME
                      value: "0"
    - name: rank1
      replicas: 1
      template:
        metadata:
          labels:
            kubepmix.dev/enabled: "true"
            kubepmix.dev/containerRanks: "1"
        spec:
          backoffLimit: 0
          parallelism: 1
          completions: 1
          template:
            spec:
              restartPolicy: Never
              terminationGracePeriodSeconds: 0
              containers:
                - name: worker
                  image: ghcr.io/jjlakis/simplempi:0.6.0
                  env:
                    - name: "RANK_SPECIFIC_DATA"
                      value: "I will do the job of rank 1"

                    # Run 1 All Gather
                    - name: GATHER_COUNT
                      value: "1"
                    - name: GATHER_TIME
                      value: "0"
