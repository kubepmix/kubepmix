services:
  server:
    image: ghcr.io/kubepmix/kubepmix:0.0.4
    environment:
      KUBE_PMIX_SERVER_PORT: "3333"
      KUBE_PMIX_SERVER_IFACE: "eth0"
      PMIX_MCA_psec: "none" # Do not check processes UID and GUID
      # Pre-creation of namespace
      KUBE_PMIX_NAMESPACE_NAME: "test"
      KUBE_PMIX_JOB_SIZE: "2"
    networks:
      kube-pmix-net:
        ipv4_address: 10.3.0.10

  simplempi0:
    build:
      context: ./tools/simplempi
      dockerfile: Dockerfile
    environment:
      PMIX_NAMESPACE: "test"
      PMIX_RANK: "0"
      PMIX_SERVER_URI2: "kubepmix.1;tcp4://10.0.0.10:3333"
      PMIX_SERVER_URI21: "kubepmix.1;tcp4://10.0.0.10:3333"
      PMIX_SERVER_URI3: "kubepmix.1;tcp4://10.0.0.10:3333"
      PMIX_SERVER_URI4: "kubepmix.1;tcp4://10.0.0.10:3333"
      PMIX_SERVER_URI41: "kubepmix.1;tcp4://10.0.0.10:3333"
      PMIX_SECURITY_MODE: "none"
      PMIX_GDS_MODULE: "hash" # Required
      SLEEP_TIME: "1"
      SLEEP_COUNT: "5"
      OMPI_MCA_btl: "tcp,self"
      OMPI_MCA_mpi_ft_enable: "1"

    #    depends_on:
    #      server:
    #        condition: service_started
    networks:
      - kube-pmix-net

  simplempi1:
    build:
      context: ./tools/simplempi
      dockerfile: Dockerfile
    environment:
      PMIX_NAMESPACE: "test"
      PMIX_RANK: "1"
      PMIX_SERVER_URI41: "kubepmix.1;tcp4://10.0.0.10:3333"
      PMIX_SERVER_URI4: "kubepmix.1;tcp4://10.0.0.10:3333"
      PMIX_SERVER_URI3: "kubepmix.1;tcp4://10.0.0.10:3333"
      PMIX_SERVER_URI2: "kubepmix.1;tcp4://10.0.0.10:3333"
      PMIX_SERVER_URI21: "kubepmix.1;tcp4://10.0.0.10:3333"
      PMIX_SECURITY_MODE: "none"
      PMIX_GDS_MODULE: "hash"
      SLEEP_TIME: "1"
      SLEEP_COUNT: "1"
      OMPI_MCA_btl: "tcp,self"
      OMPI_MCA_mpi_ft_enable: "1"
      #OMPI_MCA_btl_base_verbose: "20"

      #OMPI_MCA_btl: "tcp"

    #    depends_on:
    #      server:
    #        condition: service_started
    networks:
      - kube-pmix-net

networks:
  kube-pmix-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.3.0.0/24
